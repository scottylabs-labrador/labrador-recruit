# Secrets for Recruit, the ScottyLabs recruitment review platform.
#
# Every value below is resolved from OpenBao at run time rather than committed.
# The application holds real applicant names, emails and essays, so a leaked
# value here is a disclosure rather than an inconvenience: rotate rather than
# reuse if one is ever printed, pasted, or committed.
[project]
name = "recruit"
revision = "1.0"

[providers]
bao = "openbao://bao.scottylabs.org/labrador"

# Object storage for applicant uploads. See docs/adr/0004-railway-and-cloudflare-r2.md.
#
# All four are needed together: `lib/storage.ts` selects the R2 adapter only
# when every one is present, and refuses the local filesystem adapter unless
# ALLOW_LOCAL_FILE_STORAGE is explicitly "on". A half-configured deployment
# therefore fails at boot rather than quietly storing resumes on a container
# disk and losing them on the next deploy.
[secrets.R2_ACCOUNT_ID]
description = "Cloudflare account id that owns the bucket"
required = false

[secrets.R2_ACCESS_KEY_ID]
description = "R2 access key with PutObject, GetObject and HeadObject on the bucket"
required = false

[secrets.R2_SECRET_ACCESS_KEY]
description = "R2 secret for the access key above"
required = false

[secrets.R2_BUCKET]
description = "The private bucket name. Never public-read."
required = false

[profiles.default.defaults]
providers = ["bao"]

[profiles.local.defaults]
providers = ["bao"]

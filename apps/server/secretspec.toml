[project]
name = "server"
revision = "1.0"
extends = ["../../packages/db/secretspec.toml"]

[profiles.default]
ADMIN_GROUP = { description = "Identity-provider group whose members hold the global admin role. Wrong value means nobody can create a cycle.", required = true }
ALLOWED_ORIGINS_REGEX = { description = "Regex of browser origins allowed to send credentialed requests. Too narrow and the interface silently gets no data; too wide and any site can act as a signed-in user.", required = true }
AUTH_CLIENT_ID = { description = "OIDC client id from Goldador. Left as 'not-yet-registered' the interface withholds single sign-on and offers password sign-in instead.", required = true }
AUTH_CLIENT_SECRET = { description = "OIDC client secret. Never paste this anywhere but the deployment's variable editor; one that appears in a transcript must be rotated.", required = true }
AUTH_ISSUER = { description = "Keycloak realm URL. Must be reachable at boot or OIDC discovery fails and sign-in 500s.", required = true }
AUTH_JWKS_URI = { description = "Realm JWKS endpoint, used to verify bearer tokens. Wrong value rejects every API token as unauthenticated.", required = true }
BETTER_AUTH_URL = { description = "Origin the interface is served from. Same as SERVER_URL on a single-deployment install; when they differ the session cookie must be cross-site.", required = true }
SENTRY_DSN = { description = "Error reporting. Optional. Applicant content must never reach it - see product rule 6.", required = false }
SERVER_URL = { description = "Public origin of the API. Better Auth builds its callback URLs from this, so a wrong value breaks sign-in after the identity provider redirects back.", required = true }

[profiles.local]
ADMIN_GROUP = { default = "labrador-recruit", ref = { item = "labrador-recruit/local/server", field = "ADMIN_GROUP" } }
ALLOWED_ORIGINS_REGEX = { default = "^https?://localhost:3000$", ref = { item = "labrador-recruit/local/server", field = "ALLOWED_ORIGINS_REGEX" } }
AUTH_CLIENT_ID = { ref = { item = "labrador-recruit/generated/local", field = "AUTH_CLIENT_ID" } }
AUTH_CLIENT_SECRET = { ref = { item = "labrador-recruit/generated/local", field = "AUTH_CLIENT_SECRET" } }
AUTH_ISSUER = { default = "https://idp.scottylabs.org/realms/labrador", ref = { item = "labrador-recruit/local/server", field = "AUTH_ISSUER" } }
AUTH_JWKS_URI = { default = "https://idp.scottylabs.org/realms/labrador/protocol/openid-connect/certs", ref = { item = "labrador-recruit/local/server", field = "AUTH_JWKS_URI" } }
BETTER_AUTH_URL = { default = "http://localhost:3000", ref = { item = "labrador-recruit/local/server", field = "BETTER_AUTH_URL" } }
SERVER_URL = { default = "http://localhost", ref = { item = "labrador-recruit/local/server", field = "SERVER_URL" } }

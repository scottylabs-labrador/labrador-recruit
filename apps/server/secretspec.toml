[project]
name = "server"
revision = "1.0"
extends = ["../../packages/db/secretspec.toml"]

[profiles.default]
ADMIN_GROUP = { description = "Admin group", required = true }
ALLOWED_ORIGINS_REGEX = { description = "Allowed CORS origins regex", required = true }
AUTH_CLIENT_ID = { description = "Keycloak client ID", required = true }
AUTH_CLIENT_SECRET = { description = "Keycloak client secret", required = true }
AUTH_ISSUER = { description = "Keycloak issuer URL", required = true }
AUTH_JWKS_URI = { description = "Keycloak JWKS URI", required = true }
BETTER_AUTH_URL = { description = "Better Auth trusted origin URL", required = true }
SENTRY_DSN = { description = "Sentry DSN", required = false }
SERVER_URL = { description = "Server URL", required = true }

[profiles.local]
ADMIN_GROUP = { default = "labrador-recruit", ref = { item = "labrador-recruit/local/server", field = "ADMIN_GROUP" } }
ALLOWED_ORIGINS_REGEX = { default = "^https?://localhost:3000$", ref = { item = "labrador-recruit/local/server", field = "ALLOWED_ORIGINS_REGEX" } }
AUTH_CLIENT_ID = { ref = { item = "labrador-recruit/generated/local", field = "AUTH_CLIENT_ID" } }
AUTH_CLIENT_SECRET = { ref = { item = "labrador-recruit/generated/local", field = "AUTH_CLIENT_SECRET" } }
AUTH_ISSUER = { default = "https://idp.scottylabs.org/realms/labrador", ref = { item = "labrador-recruit/local/server", field = "AUTH_ISSUER" } }
AUTH_JWKS_URI = { default = "https://idp.scottylabs.org/realms/labrador/protocol/openid-connect/certs", ref = { item = "labrador-recruit/local/server", field = "AUTH_JWKS_URI" } }
BETTER_AUTH_URL = { default = "http://localhost:3000", ref = { item = "labrador-recruit/local/server", field = "BETTER_AUTH_URL" } }
SERVER_URL = { default = "http://localhost", ref = { item = "labrador-recruit/local/server", field = "SERVER_URL" } }

[project]
name = "worker"
revision = "1.0"
extends = ["../../packages/db/secretspec.toml"]

[profiles.default]
EMAIL_PROVIDER_API_KEY = { description = "Credential for the transactional email provider. Unset means notifications are claimed and logged rather than sent, which is what a local run wants.", required = false }
EMAIL_FROM_ADDRESS = { description = "Envelope sender for every outgoing notification. Wrong value means mail is delivered but filed as spam.", required = false }
SENTRY_DSN = { description = "Error reporting. Optional. Applicant content must never reach it - see docs/product-rules.md section 6.", required = false }

[profiles.local]
EMAIL_FROM_ADDRESS = { default = "recruit@scottylabs.org" }
